name: Build PDFs

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Git tag to build and prepare as a draft release (optional)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Compile books
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      # Build volume 1 first because the other volumes and addons import its
      # labels through xr's \externaldocument command.
      - name: Compile PDFs with latexmk
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode volume-1.tex
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode volume-2.tex
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode volume-3.tex
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode addons.tex
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode ideas.tex

      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: algebraic-general-topology-pdfs
          path: |
            volume-1.pdf
            volume-2.pdf
            volume-3.pdf
            addons.pdf
            ideas.pdf
          if-no-files-found: error

  prepare-release:
    name: Attach PDFs to draft release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pdf-release-${{ inputs.release_tag }}

    steps:
      - name: Download compiled PDFs
        uses: actions/download-artifact@v7
        with:
          name: algebraic-general-topology-pdfs
          path: pdfs

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          if is_draft=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$TAG_NAME"); then
            if [[ "$is_draft" != true ]]; then
              echo "::error::This release is already published. Use a new tag to release these PDFs."
              exit 1
            fi
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$TAG_NAME" pdfs/*.pdf
          else
            gh release create --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG_NAME" -- "$TAG_NAME" pdfs/*.pdf
          fi
